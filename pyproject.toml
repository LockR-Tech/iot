[project]
name = "aisl-project"
version = "0.1.0"
description = "AISL Smart Locker IoT – Raspberry Pi Controller"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "paho-mqtt>=2.1.0",
    "pyserial>=3.5",
    "python-dotenv>=1.0.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.27.0",
    "psycopg2-binary>=2.9.9",
    "gpiod>=2.2; sys_platform == 'linux'",  # GPIO trực tiếp (HARDWARE_BACKEND=gpio)
    # Mở ô qua Bluetooth (F3-G11): GATT server trên BlueZ. bless 0.2.6 còn dùng module của bleak < 1.
    "bless>=0.2.6; sys_platform == 'linux'",
    "bleak>=0.22,<1; sys_platform == 'linux'",
    "cryptography>=43",  # kiểm chữ ký Ed25519 của mã mở ô
]
